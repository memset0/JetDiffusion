<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JetDiffusion</title>

<style>
:root{--bg:#fafaf9;--ink:#1c2024;--muted:#5d6670}
@media (prefers-color-scheme:dark){:root{--bg:#141618;--ink:#e8eaed;--muted:#9aa3ad}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
main{max-width:1200px;margin:0 auto;padding:48px 16px}
h1{margin:0 0 12px;font-size:clamp(2rem,6vw,3.2rem);letter-spacing:-.01em}
p{margin:0 auto 8px;color:var(--muted);max-width:40rem}
.soon{margin-top:24px;color:var(--ink);font-weight:600}
video{display:block;width:100%;height:auto;aspect-ratio:1920/864;margin:32px 0 12px;border-radius:8px;background:#000}
.cap{font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>JetDiffusion</h1>
<p>Pushing the Speed Limits of Video Generation with NVFP4 Sparse Attention</p>
<video src="media/jetdiffusion-grid.mp4" poster="media/jetdiffusion-grid.jpg" autoplay muted loop playsinline preload="auto" aria-label="Twenty videos generated by JetDiffusion"></video>
<p class="cap">Videos generated by JetDiffusion from Wan2.1-14B.</p>
<p class="soon">Code and models coming soon.</p>
</main>
</body>
</html>
